name: Build Release

on:
  push:
    # 提交到维护分支时构建，推送 tag 时额外发布 Release
    branches:
      - independent-maintenance
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - windows
          - linux
          - android

jobs:
  build-windows:
    if: github.event_name == 'push' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'windows'
    runs-on: windows-latest
    # 默认缓存目录带隐藏属性，会导致 cargokit 读取失败，改用无隐藏属性的路径
    env:
      PUB_CACHE: D:\pub-cache
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # 与仓库的 Gradle 8.14 / AGP 8.12 及依赖约束保持一致
          flutter-version: "3.47.9"
          cache: true
      - run: flutter pub get
      # 修正 Windows 构建依赖：cargokit 隐藏目录问题与 tailscale 的 GOCACHE 缺失
      # 详见 buildtools/fix-cargokit-windows.ps1
      - name: Patch cargokit + tailscale for Windows build
        run: powershell -ExecutionPolicy Bypass -File buildtools/fix-cargokit-windows.ps1
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build windows --release --verbose
      - name: Extract Version
        id: extract_version
        run: |
          $pubspec = Get-Content pubspec.yaml -Raw
          if ($pubspec -match 'version:\s*(\d+\.\d+\.\d+)\+(\d+)') {
            $appVersion = $matches[1]
            $buildNumber = $matches[2]
            Write-Host "app_version=$appVersion" >> $env:GITHUB_OUTPUT
            Write-Host "build_number=$buildNumber" >> $env:GITHUB_OUTPUT
          }
      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output-windows
          path: build/windows/x64/runner/Release/
      - name: Compile Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: setup.iss
          options: "/DAppVersion=${{ steps.extract_version.outputs.app_version }} /DBuildNumber=${{ steps.extract_version.outputs.build_number }}"
      - name: Archive installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output-windows-installer
          path: Installer/server_manager_*.exe

  build-linux:
    if: github.event_name == 'push' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'linux'
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # 与仓库的 Gradle 8.14 / AGP 8.12 及依赖约束保持一致
          flutter-version: "3.47.9"
          cache: true
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev
          sudo apt-get install -y libwebkit2gtk-4.1-dev
          sudo apt-get install -y libmpv-dev mpv
          sudo apt-get install -y libayatana-appindicator3-dev
          sudo apt-get install -y keybinder-3.0
          sudo apt-get install -y libnotify-dev
          sudo apt-get install -y libsecret-1-dev
          sudo apt-get install -y libcurl4-openssl-dev
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build linux --release --no-tree-shake-icons
      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output-linux
          path: build/linux/x64/release/bundle/
      - name: Build AppImage
        run: bash buildtools/build-appimage.sh
      - name: Archive AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output-linux-appimage
          path: "./*.AppImage*"

  build-android:
    if: github.event_name == 'push' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'android'
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      # 加入 sdkmanager 到 PATH，跳过已废弃的 tools 包
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android build dependencies
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # 与仓库的 Gradle 8.14 / AGP 8.12 及依赖约束保持一致
          flutter-version: "3.47.9"
          cache: true
      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # 未配置密钥时构建未签名包
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "未配置签名密钥，跳过签名配置"
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEYSTORE_PASSWORD"
          } > android/key.properties
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build apk --release --split-per-abi
      - name: Normalize Android artifact names
        run: |
          mkdir -p ./android-release
          for f in build/app/outputs/flutter-apk/app-*-release*.apk; do
            [ -f "$f" ] || continue
            name=$(basename "$f" .apk)
            name=${name%-unsigned}
            cp "$f" "./android-release/$name.apk"
          done
          ls -la ./android-release
      - name: Archive Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output-android
          path: ./android-release/app-*-release.apk

  publish-release:
    needs: [build-windows, build-linux, build-android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载各平台产物
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      - name: 整理发布文件
        run: |
          # 文件名需与客户端下载链接一致
          mkdir -p ./release
          (cd ./artifacts/build-output-windows-installer && zip -qr ../../release/build-output-windows-installer.zip .)
          (cd ./artifacts/build-output-linux-appimage && zip -qr ../../release/build-output-linux-appimage.zip .)
          cp ./artifacts/build-output-android/app-*-release.apk ./release/
      - name: 创建 Release 并上传安装包
        uses: softprops/action-gh-release@v2
        with:
          files: ./release/*
          generate_release_notes: true
